services:
  tryon-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - BASE_URL=http://localhost:8000
      - DEVICE=cuda
      - MEDIA_DIR=/data/media
      - JOB_DIR=/data/jobs
    volumes:
      - ./data:/data
      # Mount StableVITON repo (recommended during dev)
      - ./stableviton:/opt/stableviton
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
